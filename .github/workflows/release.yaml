on:
    push:
        branches:
            - master
        tags:
            - v*

env:
    REGISTRY: ghcr.io
    APP_IMAGE_NAME: v3xlabs/dmn
    APP_BINARY_NAME: dmn

jobs:
    build:
        strategy:
            matrix:
                platform:
                    - runs_on: ubuntu-latest
                      nix_system: x86_64-linux
                      rust_target: x86_64-unknown-linux-musl
                      arch: amd64
                    - runs_on: ubuntu-24.04-arm
                      nix_system: aarch64-linux
                      rust_target: aarch64-unknown-linux-musl
                      arch: arm64
        timeout-minutes: 30
        runs-on: ${{ matrix.platform.runs_on }}
        permissions:
            contents: write
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set release version
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  version="${GITHUB_REF#refs/tags/v}"
                  sed -i "0,/^version = .*/s//version = \"${version}\"/" app/Cargo.toml
                  awk -v ver="$version" '
                    /^name = "dmn"$/ { in_dmn = 1 }
                    in_dmn && /^version = / { print "version = \"" ver "\""; in_dmn = 0; next }
                    { print }
                  ' app/Cargo.lock > app/Cargo.lock.tmp
                  mv app/Cargo.lock.tmp app/Cargo.lock

            - name: Install Nix
              uses: cachix/install-nix-action@v31
              with:
                  extra_nix_config: |
                      experimental-features = nix-command flakes

            - name: Cache Nix store
              uses: nix-community/cache-nix-action@v6
              with:
                  primary-key: nix-${{ matrix.platform.nix_system }}-${{ hashFiles('flake.lock', 'app/Cargo.lock', 'app/src/web/pnpm-lock.yaml') }}
                  restore-prefixes-first-match: nix-${{ matrix.platform.nix_system }}-

            - name: Run flake checks
              run: nix flake check

            - name: Build static release binary
              run: nix build .#static -o result-static

            - name: Prepare release binary
              if: startsWith(github.ref, 'refs/tags/v')
              run: |
                  install -Dm755 result-static/bin/${{ env.APP_BINARY_NAME }} \
                    ./${{ env.APP_BINARY_NAME }}-${{ matrix.platform.rust_target }}

            - name: Upload binary to GitHub Release
              uses: softprops/action-gh-release@v2
              if: startsWith(github.ref, 'refs/tags/v')
              with:
                  tag_name: ${{ github.ref_name }}
                  files: ./${{ env.APP_BINARY_NAME }}-${{ matrix.platform.rust_target }}
                  fail_on_unmatched_files: false
                  prerelease: ${{ contains(github.ref, '-') }}

            - name: Build Docker image
              run: nix build .#dockerImage -o result-docker

            - name: Push per-arch image to GHCR
              run: |
                  mkdir -p /tmp/digests
                  nix shell nixpkgs#skopeo -c skopeo copy \
                    --tmpdir "${RUNNER_TEMP:-/tmp}" \
                    --dest-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
                    --digestfile /tmp/digest.txt \
                    docker-archive:result-docker \
                    "docker://${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:build-${{ matrix.platform.arch }}"
                  digest="$(cat /tmp/digest.txt)"
                  touch "/tmp/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ matrix.platform.arch }}
                  path: /tmp/digests/*
                  if-no-files-found: error
                  retention-days: 1

    docker-merge:
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        permissions:
            contents: read
            packages: write
            attestations: write
            id-token: write
        needs:
            - build
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: /tmp/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=semver,pattern={{major}}
                      type=edge
                      type=sha

            - name: Create manifest list and push
              working-directory: /tmp/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}@sha256:%s ' *)

            - name: Inspect image
              run: |
                  docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.APP_IMAGE_NAME }}:${{ steps.meta.outputs.version }}
